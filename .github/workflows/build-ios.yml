name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install iOS dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Generate iOS project when missing
        if: ${{ !hashFiles('ios/Runner.xcodeproj/project.pbxproj') }}
        run: |
          flutter create --platforms=ios --org com.moqinglianyi --project-name fl_clash .
          flutter pub get

      - name: Set iOS deployment target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          podfile = Path('ios/Podfile')
          if podfile.exists():
              s = podfile.read_text()
              s = re.sub(r'^\s*#?\s*platform :ios,.*$', "platform :ios, '14.0'", s, count=1, flags=re.M)
              if 'platform :ios' not in s:
                  s = "platform :ios, '14.0'\n" + s
              podfile.write_text(s)
          for p in Path('ios').rglob('*'):
              if p.is_file() and p.suffix in ('.pbxproj', '.xcconfig', '.plist'):
                  try:
                      p.write_text(p.read_text().replace('13.0', '14.0'))
                  except UnicodeDecodeError:
                      pass
          PY

      - name: Build unsigned iOS app
        run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload build/ios/ipa
          mkdir -p Payload build/ios/ipa
          cp -R build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload build/ios/ipa/FlClash-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
