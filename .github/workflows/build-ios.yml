name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install iOS dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Generate iOS project when missing
        if: ${{ !hashFiles('ios/Runner.xcodeproj/project.pbxproj') }}
        run: |
          flutter create --platforms=ios --org com.moqinglianyi --project-name fl_clash .
          flutter pub get

      - name: Set iOS deployment target
        run: |
          python3 -c "from pathlib import Path; [p.write_text(p.read_text().replace('13.0', '14.0')) for p in Path('ios').rglob('*') if p.is_file() and p.suffix in ('.pbxproj', '.xcconfig', '.plist')]"
      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
          if-no-files-found: error
          retention-days: 14
